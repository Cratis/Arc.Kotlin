# Chronicle 6 dials the kernel while constructing its client bean, so any Spring context that merely
# has the starter on the classpath fails to start when no kernel is reachable. The tests in this
# source set exercise Arc's generated HTTP surface, not Chronicle, so its auto-configuration is
# excluded here rather than demanding a kernel for unrelated tests.
#
# This does not hide the behaviour: applications that actually use the Chronicle integration still
# require a reachable kernel at startup, and the chronicleRealKernelTest source set proves that path
# against a real digest-pinned kernel.
spring.autoconfigure.exclude=io.cratis.chronicle.spring.ChronicleAutoConfiguration,io.cratis.chronicle.spring.ChronicleWebAutoConfiguration
