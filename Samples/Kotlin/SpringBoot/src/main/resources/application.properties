cratis.arc.endpoints.segments-to-skip-for-route=6

# The default profile stores tasks in memory, so neither Spring Data auto-configuration runs and the
# sample starts with no connection string and no container to wait for. `./run.sh --database mongodb`
# or `--database postgres` activates the matching profile, whose properties narrow this list to the
# other store. Excluding rather than merely not configuring is deliberate: the JPA auto-configuration
# fails startup outright when it finds no DataSource, which would make the memory path depend on a
# database being absent in exactly the right way.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration
