# Stores the task board in PostgreSQL. `./run.sh --database postgres` starts the container this
# points at. The schema is created from the entity because this is a sample; a real application
# owns its schema through migrations.
spring.datasource.url=${ARC_SAMPLE_POSTGRES_URL:jdbc:postgresql://localhost:5432/arc-samples}
spring.datasource.username=${ARC_SAMPLE_POSTGRES_USER:arc}
spring.datasource.password=${ARC_SAMPLE_POSTGRES_PASSWORD:arc}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Only the MongoDB auto-configurations stay excluded here.
spring.autoconfigure.exclude=\
  org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration,\
  org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration
