# Gradle properties for Gradle 8.13 and Kotlin 2.1.0

# JVM memory configuration for Gradle daemon and inherited by Kotlin daemon
# Note: Use -Xmx2g (not -J-Xmx2g) - the -J prefix is not valid in Gradle properties
org.gradle.jvmargs=-Xmx2g

# Gradle performance settings
org.gradle.parallel=true
org.gradle.caching=true
