name: Kotlin Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Linux is case-sensitive, but contributors commonly use case-insensitive file systems.
      - name: Check for paths that differ only by case
        shell: bash
        run: |
          collisions=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$collisions" ]; then
            echo "::error::Paths differing only by case cannot be checked out on a case-insensitive filesystem:"
            echo "$collisions"
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ContractTests/TypeScript/package-lock.json

      - name: Clean, build, and test the complete workspace
        run: ./gradlew clean build --no-configuration-cache -x :ContractTests:typeScriptRuntimeTest

      # These are deliberately explicit release gates even though the full build also reaches them.
      - name: Verify deterministic and strict TypeScript proxies
        run: |
          ./gradlew \
            :GradlePlugin:verifyContractTestProxyDeterminism \
            :ContractTests:typeScriptBuild \
            --no-configuration-cache

      - name: Run TypeScript runtime proxy gate
        run: timeout --signal=TERM --kill-after=15s 300s ./gradlew :ContractTests:typeScriptRuntimeTest --no-configuration-cache

      - name: Verify documentation
        run: ./Documentation/verify-markdown.sh
