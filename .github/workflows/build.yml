name: Kotlin Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Workflow files are only ever executed by GitHub, so a defect in one surfaces at release time
  # rather than at review time. Linting them here makes that a pull request failure instead.
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to an exact release and checksum-verified, so this trusts no third-party action and
      # lints with the same binary contributors run locally.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" actionlint
          rm -f "${RUNNER_TEMP}/${archive}"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      # shellcheck is preinstalled on the runner image; actionlint hands every `run:` script to it.
      - name: Lint workflow files
        run: actionlint -color

  # Required before merge: this executes the processor on both supported runtimes,
  # not just a JDK17 compiler toolchain hosted by a different Gradle runtime.
  fluent-parser-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        processor-jdk: [17, 21]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install full JDK 21
        id: jdk21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Keep the parent Gradle build on 17; tests explicitly choose the parser and
      # nested Gradle processor runtime and assert the actual in-processor trace.
      - name: Set up JDK 17
        id: jdk17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ContractTests/TypeScript/package-lock.json

      - name: Verify embedded parser and native processor runtime compatibility
        env:
          PROCESSOR_JDK: ${{ matrix.processor-jdk }}
          JDK17_HOME: ${{ steps.jdk17.outputs.path }}
          JDK21_HOME: ${{ steps.jdk21.outputs.path }}
        run: |
          set -euo pipefail
          runtime_homes="${JDK17_HOME}"
          if [ "${PROCESSOR_JDK}" = 21 ]; then
            runtime_homes="${JDK17_HOME}:${JDK21_HOME}"
          fi
          ./gradlew :CodeGeneration:KSP:test :GradlePlugin:test \
            --tests '*FluentSourceParserCompatibilityTest' \
            --tests '*ArcFluentValidationCompilationTest' \
            --tests '*ArcFluentValidationNativeFunctionalTest' \
            --tests '*ArcFluentValidationRuntimeCompatibilityFunctionalTest' \
            "-Parc.fluentParserTestJdk=${PROCESSOR_JDK}" \
            "-Parc.fluentRuntimeJdks=${runtime_homes}" \
            "-Dorg.gradle.java.installations.paths=${JDK17_HOME},${JDK21_HOME}" \
            -Dorg.gradle.java.installations.auto-download=false \
            --no-build-cache --no-configuration-cache --stacktrace

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux is case-sensitive, but contributors commonly use case-insensitive file systems.
      - name: Check for paths that differ only by case
        shell: bash
        run: |
          collisions=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$collisions" ]; then
            echo "::error::Paths differing only by case cannot be checked out on a case-insensitive filesystem:"
            echo "$collisions"
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ContractTests/TypeScript/package-lock.json

      - name: Clean, build, and test the complete workspace
        run: ./gradlew clean build --no-configuration-cache -x :ContractTests:typeScriptRuntimeTest

      # These are deliberately explicit release gates even though the full build also reaches them.
      - name: Verify deterministic and strict TypeScript proxies
        run: |
          ./gradlew \
            :GradlePlugin:verifyContractTestProxyDeterminism \
            :ContractTests:typeScriptBuild \
            --no-configuration-cache

      - name: Run TypeScript runtime proxy gate
        run: timeout --signal=TERM --kill-after=15s 300s ./gradlew :ContractTests:typeScriptRuntimeTest --no-configuration-cache

      - name: Verify documentation
        # JDK 17 is set up above, so a blocked snippet compilation here means the
        # toolchain broke rather than being absent, and must fail the build.
        run: ./Documentation/verify-markdown.sh --strict-toolchains
