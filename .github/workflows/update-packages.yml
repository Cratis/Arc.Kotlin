name: Update Packages

on:
  schedule:
    - cron: '19 7 * * 1'
  workflow_dispatch:

jobs:
  update:
    uses: Cratis/Workflows/.github/workflows/update-packages.yml@main
    with:
      # JDK 17 matches build.yml; arc-ksp's fluent parser runs only on JDK 17.
      java-version: '17'
    secrets:
      PAT_WORKFLOWS: ${{ secrets.PAT_WORKFLOWS }}
