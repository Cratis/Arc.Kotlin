name: Automatic Dependency Updates Suspended

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  updates-suspended:
    name: Automatic dependency updates suspended
    runs-on: ubuntu-latest
    steps:
      - name: Report suspension
        shell: bash
        run: |-
          printf '%s\n' 'Automatic dependency updates are suspended pending #121; no dependency updates will run.'
