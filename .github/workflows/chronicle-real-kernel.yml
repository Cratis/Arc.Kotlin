name: Chronicle Real Kernel

on:
  workflow_call: {}
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "Source/**"
      - "CodeGeneration/KSP/**"
      - "Integrations/Chronicle/**"
      - "Integrations/SpringBoot/**"
      - "ContractTests/**"
      - "Samples/Kotlin/ChronicleSpringBoot/**"
      - "Samples/Java/ChronicleSpringBoot/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/chronicle-real-kernel.yml"
  push:
    branches:
      - main
    paths:
      - "Source/**"
      - "CodeGeneration/KSP/**"
      - "Integrations/Chronicle/**"
      - "Integrations/SpringBoot/**"
      - "ContractTests/**"
      - "Samples/Kotlin/ChronicleSpringBoot/**"
      - "Samples/Java/ChronicleSpringBoot/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/chronicle-real-kernel.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Verify generated Arc and Chronicle behavior against the real kernel
        run: ./gradlew :ContractTests:chronicleRealKernelTest --no-configuration-cache
