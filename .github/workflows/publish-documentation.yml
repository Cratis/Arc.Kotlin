name: Publish Documentation

# The JVM pages under /arc/backend/kotlin/** are built by the Cratis/Documentation
# site, which rebuilds when a product repository dispatches `build-docs`. Nothing
# here dispatched it, so a merged documentation change reached cratis.io only when
# another repository happened to trigger a site build (#226).

on:
  push:
    branches: [main]
    paths:
      - "Documentation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Documentation Build
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.PAT_DOCUMENTATION }}
          repository: cratis/documentation
          event-type: build-docs
