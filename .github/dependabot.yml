version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Etc/UTC"
    labels:
      - dependencies
      - no-release
    open-pull-requests-limit: 10
    # Temporary hold until the coordinated publishing migration in #121 is approved.
    # No versions or update-types restriction: ignore every publishing plugin update.
    ignore:
      - dependency-name: "com.vanniktech.maven.publish"
      # Arc must compile against the versions the supported Boot host supplies at runtime. Keep
      # these synchronized with Spring Boot 4.1.1's BOM and Jackson 2 compatibility module; #135
      # demonstrated that compiling against a newer coroutines binary can crash after Boot's
      # dependency management selects its older runtime version.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-core"
        versions: [">1.10.2"]
      - dependency-name: "tools.jackson.*"
        versions: [">3.1.5"]
      # Hold later Boot minors until their managed Jackson and coroutines versions are deliberately synchronized.
      - dependency-name: "springBootVersion"
        versions: [">=4.2.0"]
      - dependency-name: "org.springframework.boot"
        versions: [">=4.2.0"]
    groups:
      kotlin-ksp-toolchain:
        # PR #73 confirms Dependabot's names for kotlin("jvm") and kotlin("plugin.spring").
        # Grouping is review isolation, not proof of cross-component version compatibility.
        patterns:
          - "jvm"
          - "plugin.spring"
          - "org.jetbrains.kotlin:*"
          - "com.google.devtools.ksp"
          - "com.google.devtools.ksp:*"
          - "dev.zacsweers.kctfork:*"
        update-types:
          - minor
          - patch
      publishing:
        # Kept separate when the temporary ignore above is deliberately revisited.
        patterns:
          - "com.vanniktech.maven.publish"
        update-types:
          - minor
          - patch
      gradle-non-major:
        exclude-patterns:
          - "jvm"
          - "plugin.spring"
          - "org.jetbrains.kotlin:*"
          - "com.google.devtools.ksp"
          - "com.google.devtools.ksp:*"
          - "dev.zacsweers.kctfork:*"
          - "com.vanniktech.maven.publish"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/ContractTests/TypeScript"
    schedule:
      interval: daily
      time: "06:15"
      timezone: "Etc/UTC"
    labels:
      - dependencies
      - no-release
    open-pull-requests-limit: 10
    groups:
      npm-non-major:
        update-types:
          - minor
          - patch
