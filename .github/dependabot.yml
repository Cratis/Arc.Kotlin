version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Etc/UTC"
    labels:
      - dependencies
      - no-release
    open-pull-requests-limit: 10
    # Temporary hold until the coordinated publishing migration in #121 is approved.
    # No versions or update-types restriction: ignore every publishing plugin update.
    ignore:
      - dependency-name: "com.vanniktech.maven.publish"
      # kotlinx-coroutines 1.10 moved its default-argument bridges onto the interfaces, so anything
      # Arc compiles against 1.10+ fails with NoSuchMethodError under Spring Boot, whose BOM pins
      # coroutines to 1.8.1 and wins in every consuming application. Only the TypeScript runtime
      # gate catches it. Revisit when the supported Spring Boot manages 1.10 or later. See #135.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-core"
        versions: [">=1.10.0"]
    groups:
      kotlin-ksp-toolchain:
        # PR #73 confirms Dependabot's names for kotlin("jvm") and kotlin("plugin.spring").
        # Grouping is review isolation, not proof of cross-component version compatibility.
        patterns:
          - "jvm"
          - "plugin.spring"
          - "org.jetbrains.kotlin:*"
          - "com.google.devtools.ksp"
          - "com.google.devtools.ksp:*"
          - "dev.zacsweers.kctfork:*"
        update-types:
          - minor
          - patch
      publishing:
        # Kept separate when the temporary ignore above is deliberately revisited.
        patterns:
          - "com.vanniktech.maven.publish"
        update-types:
          - minor
          - patch
      gradle-non-major:
        exclude-patterns:
          - "jvm"
          - "plugin.spring"
          - "org.jetbrains.kotlin:*"
          - "com.google.devtools.ksp"
          - "com.google.devtools.ksp:*"
          - "dev.zacsweers.kctfork:*"
          - "com.vanniktech.maven.publish"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/ContractTests/TypeScript"
    schedule:
      interval: daily
      time: "06:15"
      timezone: "Etc/UTC"
    labels:
      - dependencies
      - no-release
    open-pull-requests-limit: 10
    groups:
      npm-non-major:
        update-types:
          - minor
          - patch
